<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brave Home</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{background:center/cover no-repeat;transition:background-image 1s}
</style></head><body><script>
(async()=>{
const dir="images/", exts=["jpg","jpeg","png","webp","gif"];
const pad=n=>String(n).padStart(2,"0");
const exists=u=>new Promise(r=>{const m=new Image();m.onload=()=>r(1);m.onerror=()=>r(0);m.src=u});
async function find(n){
  for(const name of [String(n),pad(n)])
    for(const e of exts){const u=`${dir}${name}.${e}`;if(await exists(u))return u}
  return null;
}
try{
  let i=parseInt(localStorage.getItem("bgIndex")||"0",10)+1;
  let u=await find(i);
  if(!u){i=1;u=await find(1)}
  if(!u)throw 0;
  localStorage.setItem("bgIndex",i);
  document.body.style.backgroundImage=`url("${u}")`;
}catch(e){document.body.style.background="#000"}
})();
</script></body></html>
